# Run the API in Docker while PostgreSQL keeps running on your host machine.
#
# Networking: containers use the default bridge network and reach your host's
# Postgres through `host.docker.internal` — Docker Desktop's built-in alias for the
# host machine (works on Docker Desktop for Linux, macOS and Windows, and even a
# Postgres that only listens on 127.0.0.1 is reachable).
#
# IMPORTANT: do NOT use `network_mode: host` on Docker Desktop — its engine runs
# inside a VM, so `localhost` inside the container is the *VM's* loopback, not your
# machine's, and the container cannot reach your Postgres (Connection refused).
services:
  api:
    build: .
    # Makes host.docker.internal resolve on native Linux engines too (Docker Desktop
    # provides it via its embedded DNS; this line covers both).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The container's DATABASE_URL is built from POSTGRES_* vars (not the
      # DATABASE_URL in .env — that one is for running the app directly with uv).
      # Override like:  POSTGRES_PASSWORD=secret docker compose up --build
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ashiq}:${POSTGRES_PASSWORD:-1212}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-twatter}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    # Apply migrations, then serve. The API is reachable at http://127.0.0.1:8000.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
